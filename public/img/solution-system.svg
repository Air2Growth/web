  <title id="title">Aus Luft wird die Grundlage für Dünger</title>
  <desc id="desc">Ein modularer CO₂-Filter ist mit einem geschlossenen Mikroalgentank verbunden. Die Algen werden zu Flüssigdünger für Pflanzen verarbeitet. Vereinfachte Prinzipdarstellung, keine technische Bauzeichnung.</desc>
