<section class="scroll-mt-[120px] py-[88px] min-[901px]:py-[120px]">
                <div class="mx-auto w-full max-w-[1200px] px-5 md:px-12 grid grid-cols-1 min-[901px]:grid-cols-[1.1fr_0.9fr] gap-10 min-[901px]:gap-16 items-start">
                    <div id="kontakt">
                        <h2 class="font-serif font-normal leading-[1.08] text-balance text-[clamp(2rem,4.4vw,3.25rem)] mb-[1.2rem]">Kontaktieren Sie uns</h2>
                        <p class="font-sans text-[1.125rem] font-normal text-charcoal max-w-[800px] mb-12 opacity-85">Haben Sie Fragen zu unserem System oder dem Preismodell? Wir freuen
                        uns auf Ihre Nachricht.</p>
                        <form id="form-kontakt" data-form hx-post="/api/kontakt" hx-target="#kontakt-status" hx-swap="innerHTML" hx-indicator="#kontakt-loading" method="post" novalidate class="grid gap-5">
                            <div class="grid gap-0">
                                <label for="kontakt-name" class="block text-[0.85rem] font-bold mb-[0.4rem]">Name</label>
                                <input type="text" id="kontakt-name" name="name" autocomplete="name" required class="w-full px-4 py-[0.9rem] border border-[#c9d2d2] rounded-[8px] font-sans text-[1rem] text-ink bg-white focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px] accent-primary">
                            </div>
                            <div class="grid gap-0">
                                <label for="kontakt-email" class="block text-[0.85rem] font-bold mb-[0.4rem]">E-Mail</label>
                                <input type="email" id="kontakt-email" name="email" autocomplete="email" required class="w-full px-4 py-[0.9rem] border border-[#c9d2d2] rounded-[8px] font-sans text-[1rem] text-ink bg-white focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px] accent-primary">
                            </div>
                            <div class="grid gap-0">
                                <label for="kontakt-nachricht" class="block text-[0.85rem] font-bold mb-[0.4rem]">Ihre Nachricht</label>
                                <textarea id="kontakt-nachricht" name="message" rows="5" required class="w-full px-4 py-[0.9rem] border border-[#c9d2d2] rounded-[8px] font-sans text-[1rem] text-ink bg-white focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px] accent-primary"></textarea>
                            </div>

                            <!-- Honeypot gegen Bots: fuer Menschen unsichtbar -->
                            <div class="absolute left-[-9999px] w-px h-px overflow-hidden" aria-hidden="true">
                                <label for="kontakt-botcheck">Dieses Feld bitte leer lassen</label>
                                <input type="checkbox" id="kontakt-botcheck" name="botcheck" tabindex="-1" autocomplete="off">
                            </div>

                            <div class="flex items-start gap-[0.6rem] text-[0.85rem] [&_a]:text-primary-dark [&_a]:underline-offset-2 hover:[&_a]:underline">
                                <input type="checkbox" id="kontakt-datenschutz" name="datenschutz_zustimmung" value="Ja, zugestimmt" required class="w-auto mt-[0.3rem] accent-primary focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px]">
                                <label for="kontakt-datenschutz" class="cursor-pointer">Ich stimme zu, dass meine Daten zur Bearbeitung der Anfrage
                                    gemäß der <a href="/datenschutz">Datenschutzerklärung</a> verarbeitet werden.</label>
                            </div>
                            <div>
                                <button type="submit" class="inline-flex items-center gap-[0.6rem] no-underline font-bold text-[1rem] font-sans transition-colors duration-200 cursor-pointer border border-transparent bg-primary text-white px-[1.9rem] py-[1rem] rounded-full hover:bg-primary-dark focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px]">Nachricht senden</button>
                                <span id="kontakt-loading" class="htmx-indicator text-[0.75rem] opacity-75" aria-hidden="true">Wird gesendet …</span>
                            </div>
                            <div id="kontakt-status" data-status class="mt-3 text-[0.9rem] min-h-[1.4em] [&_.ok]:font-bold [&_.error]:text-error [&_.error]:font-bold" aria-live="polite"></div>
                        </form>
                    </div>

                    <div id="newsletter" class="bg-accent-tint rounded-[20px] p-6 md:p-10 [&_h2]:font-serif [&_h2]:font-normal [&_h2]:leading-[1.08] [&_h2]:text-balance [&_h2]:text-[clamp(1.6rem,3vw,2.2rem)] [&_h2]:mb-[1rem] [&_p]:max-w-none">
                        <h2 class="font-serif font-normal leading-[1.08] text-balance text-[clamp(2rem,4.4vw,3.25rem)] mb-[1.2rem]">Auf dem Laufenden bleiben</h2>
                        <p>Wir melden uns, wenn es bei Air2Growth Neuigkeiten gibt – neue
                        Meilensteine, Testergebnisse, Verfügbarkeit.</p>
                        <form id="form-info" data-form hx-post="/api/newsletter" hx-target="#info-status" hx-swap="innerHTML" hx-indicator="#info-loading" method="post" novalidate class="grid gap-5">
                            <div class="grid gap-0">
                                <label for="info-email" class="block text-[0.85rem] font-bold mb-[0.4rem]">E-Mail-Adresse</label>
                                <input type="email" id="info-email" name="email" autocomplete="email" required class="w-full px-4 py-[0.9rem] border border-[#c9d2d2] rounded-[8px] font-sans text-[1rem] text-ink bg-white focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px] accent-primary">
                            </div>

                            <!-- Honeypot gegen Bots -->
                            <div class="absolute left-[-9999px] w-px h-px overflow-hidden" aria-hidden="true">
                                <label for="info-botcheck">Dieses Feld bitte leer lassen</label>
                                <input type="checkbox" id="info-botcheck" name="botcheck" tabindex="-1" autocomplete="off">
                            </div>

                            <div class="flex items-start gap-[0.6rem] text-[0.85rem] [&_a]:text-primary-dark [&_a]:underline-offset-2 hover:[&_a]:underline">
                                <input type="checkbox" id="info-einwilligung" name="info_einwilligung" value="Ja, zugestimmt" required class="w-auto mt-[0.3rem] accent-primary focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px]">
                                <label for="info-einwilligung" class="cursor-pointer">Ich möchte per E-Mail über
                                    Neuigkeiten zu Air2Growth informiert werden und stimme der Verarbeitung meiner Daten
                                    gemäß der <a href="/datenschutz">Datenschutzerklärung</a>
                                    zu. Ich kann dem jederzeit formlos widersprechen.</label>
                            </div>
                            <div>
                                <button type="submit" class="inline-flex items-center gap-[0.6rem] no-underline font-bold text-[1rem] font-sans transition-colors duration-200 cursor-pointer border border-transparent bg-primary text-white px-[1.9rem] py-[1rem] rounded-full hover:bg-primary-dark focus-visible:outline-[3px] focus-visible:outline-primary focus-visible:outline-offset-[3px] focus-visible:rounded-[2px]">Informieren Sie mich</button>
                                <span id="info-loading" class="htmx-indicator text-[0.75rem] opacity-75" aria-hidden="true">Wird gesendet …</span>
                            </div>
                            <div id="info-status" data-status class="mt-3 text-[0.9rem] min-h-[1.4em] [&_.ok]:font-bold [&_.error]:text-error [&_.error]:font-bold" aria-live="polite"></div>
                        </form>
                    </div>
                </div>
            </section>
